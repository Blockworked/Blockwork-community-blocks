name: Check index

on:
  pull_request:
  push:
    branches: [master]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        run: python3 scripts/build-block-index.py
      - name: Fail if index.json is stale
        run: git diff --exit-code index.json
